[workspace]
resolver = "2"
members = [
    "crates/discord_core",
    "crates/discord_gateway",
    "crates/discord_rest",
    "crates/discord_voice",
    "crates/discord_storage",
    "crates/discord_app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Discord Rust Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
discord_core = { path = "crates/discord_core" }
discord_gateway = { path = "crates/discord_gateway" }
discord_rest = { path = "crates/discord_rest" }
discord_voice = { path = "crates/discord_voice" }
discord_storage = { path = "crates/discord_storage" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
bitflags = "2.6"
futures = "0.3"
bytes = "1.6"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
flate2 = "1.0"
gpui = "0.2.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "handshake"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
