<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Rust Metallic Copper Gradients -->
    <linearGradient id="rustCopperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A59" />
      <stop offset="45%" stop-color="#E05D44" />
      <stop offset="85%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    <linearGradient id="gearGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C2410C" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E05D44" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#E05D44" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#E05D44" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glow Backdrop -->
  <circle cx="120" cy="120" r="110" fill="url(#glowEffect)" />

  <!-- Squircle Base with Deep Discord Charcoal / Slate Backdrop -->
  <rect x="20" y="20" width="200" height="200" rx="48" fill="#1E1F22" stroke="#2B2D31" stroke-width="2" filter="url(#softShadow)" />

  <!-- Outer Rust Cog Ring Subtle Inset -->
  <circle cx="120" cy="120" r="78" fill="none" stroke="url(#gearGradient)" stroke-width="5" stroke-dasharray="14 8" />

  <!-- Discord Clyde Mascot In Signature Rust Copper -->
  <g transform="translate(42, 54) scale(0.65)" filter="url(#softShadow)">
    <path fill="url(#rustCopperGrad)" d="M204.4 20.4C188.8 13.2 172.2 8 154.8 5C152.7 8.8 150.2 14 148.5 18C130 15.2 111.7 15.2 93.5 18C91.8 14 89.3 8.8 87.2 5C69.8 8 53.2 13.2 37.6 20.4C6.5 66.8 -2 112 0.7 156.6C21.4 171.9 41.3 181.2 60.9 187.3C65.8 180.7 70.1 173.6 73.8 166.1C66.7 163.4 59.9 160 53.4 155.8C55.1 154.5 56.8 153.2 58.4 151.8C97.6 170 144.6 170 183.3 151.8C185 153.2 186.7 154.5 188.4 155.8C181.9 160 175.1 163.4 168 166.1C171.7 173.6 176 180.7 180.9 187.3C200.5 181.2 220.4 171.9 241.1 156.6C244.3 107.4 230.9 62.6 204.4 20.4ZM80.6 130.4C68.8 130.4 59.2 119.5 59.2 106.2C59.2 92.9 68.6 82 80.6 82C92.7 82 102.3 93 102 106.2C102 119.5 92.6 130.4 80.6 130.4ZM161.4 130.4C149.6 130.4 140 119.5 140 106.2C140 92.9 149.4 82 161.4 82C173.5 82 183.1 93 182.8 106.2C182.8 119.5 173.5 130.4 161.4 130.4Z"/>
  </g>

  <!-- Rust Crab Subtle Accent Pin at Bottom Right -->
  <g transform="translate(170, 170)">
    <circle cx="16" cy="16" r="16" fill="#E05D44" stroke="#1E1F22" stroke-width="2.5" />
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle" fill="#FFFFFF">🦀</text>
  </g>
</svg>
